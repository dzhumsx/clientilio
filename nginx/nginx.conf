# ==============================================================================
# marketiv.io (Clientilio) — High Performance Load Balancer & Reverse Proxy
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # Security: Server Masking & Core Hardening
    # --------------------------------------------------------------------------
    server_tokens off;

    # --------------------------------------------------------------------------
    # Logging: High-Resolution Real-Time Metrics Log Format
    # --------------------------------------------------------------------------
    log_format cluster_analytics '$remote_addr - $remote_user [$time_local] "$request" '
                                 '$status $body_bytes_sent "$http_referer" '
                                 '"$http_user_agent" "$http_x_forwarded_for" '
                                 'upstream_addr="$upstream_addr" '
                                 'upstream_status="$upstream_status" '
                                 'request_time=$request_time '
                                 'upstream_response_time=$upstream_response_time '
                                 'upstream_connect_time=$upstream_connect_time';

    access_log /var/log/nginx/access.log cluster_analytics buffer=32k flush=5s;

    # --------------------------------------------------------------------------
    # OS & Network Optimizations
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    types_hash_bucket_size 64;

    # --------------------------------------------------------------------------
    # Client Buffer Sizes & Upload Thresholds
    # --------------------------------------------------------------------------
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # Proxy Buffer Tuning (Optimized for JSON APIs and Large Payloads)
    # --------------------------------------------------------------------------
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    # --------------------------------------------------------------------------
    # Edge Cache for Static Assets
    # --------------------------------------------------------------------------
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=static_cache:10m max_size=500m inactive=60m use_temp_path=off;

    # --------------------------------------------------------------------------
    # Compression: Fast Gzip with Extensive Content-Type Coverage
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/font-woff
        application/font-woff2
        font/opentype
        application/wasm;

    # --------------------------------------------------------------------------
    # WebSocket Upgrade Protocol Mapping
    # --------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # --------------------------------------------------------------------------
    # Security: Bot & Vulnerability Scanner Blocker
    # --------------------------------------------------------------------------
    map $http_user_agent $blocked_scanners {
        default 0;
        ~*(sqlmap|nikto|wpscan|dirbuster|acunetix|nessus|masscan|zgrab|nmap) 1;
        ~*(havij|paros|webinspect|morfeus|fuzz|jbrofuzz) 1;
    }

    # --------------------------------------------------------------------------
    # Rate Limiting Zones (Leaky-Bucket DDoS & Brute-Force Prevention)
    # --------------------------------------------------------------------------
    # General API traffic limit: 40 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=40r/s;

    # Strict Auth limit (login, register, forgot-password): 5 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/s;

    # File uploads rate limit: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_upload_limit:10m rate=10r/s;

    limit_req_status 429;

    # --------------------------------------------------------------------------
    # Upstream Clusters: Smart Load Balancing
    # --------------------------------------------------------------------------
    # Backend Node.js API Cluster
    upstream backend_cluster {
        # Balança requisições com base nas conexões ativas de menor carga
        least_conn;
        server server:3000 max_fails=3 fail_timeout=10s weight=1;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # Frontend React SPA Cluster
    upstream frontend_cluster {
        server client:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Server Gateway (Port 80)
    # --------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name localhost _;

        # Bloqueio imediato de ferramentas de exploração automatizadas
        if ($blocked_scanners = 1) {
            return 403 '{"error":{"code":"FORBIDDEN","message":"Acesso bloqueado pela política de segurança do Load Balancer."}}\n';
        }

        # ----------------------------------------------------------------------
        # Global Security Headers
        # ----------------------------------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-LB-Node "clientilio-gateway-lb" always;

        # ----------------------------------------------------------------------
        # Common Proxy Configuration
        # ----------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Suporte completo a WebSockets e SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts de Conexão com Upstreams
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Failover Automático entre Nós do Cluster
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        # ----------------------------------------------------------------------
        # Error Handlers: Respostas Formatadas em JSON para a API
        # ----------------------------------------------------------------------
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Muitas requisições simultâneas. Por favor, aguarde alguns instantes antes de tentar novamente."}}\n';
        }

        error_page 502 503 504 = @backend_unavailable;
        location @backend_unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"O cluster de servidores está temporariamente indisponível. A solicitação será restabelecida em instantes."}}\n';
        }

        # ----------------------------------------------------------------------
        # Load Balancer Healthchecks & Status
        # ----------------------------------------------------------------------
        location = /lb-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","load_balancer":"marketiv-nginx-lb","algorithm":"least_conn","keepalive":64}\n';
        }

        location = /lb-status {
            access_log off;
            default_type application/json;
            return 200 '{"cluster":"clientilio-production","status":"online","proxy_version":"nginx-cluster-v2","security":{"rate_limiting":true,"bot_blocking":true,"websocket_proxy":true}}\n';
        }

        # Healthcheck pass-through para o backend Node.js
        location = /health {
            proxy_pass http://backend_cluster/health;
        }

        # ----------------------------------------------------------------------
        # Rotas de Autenticação (Proteção Reforçada contra Força Bruta)
        # ----------------------------------------------------------------------
        location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
            limit_req zone=api_auth_limit burst=10 nodelay;
            proxy_pass http://backend_cluster;
            proxy_set_header Connection "";
        }

        # ----------------------------------------------------------------------
        # Rota de Uploads de Arquivos e Entregáveis (Limite Ampliado para 60MB)
        # ----------------------------------------------------------------------
        location ~ ^/api/(deliverables|projects|clients)/.*/(upload|files|versions) {
            limit_req zone=api_upload_limit burst=15 nodelay;
            client_max_body_size 60M;
            proxy_pass http://backend_cluster;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_set_header Connection "";
        }

        # ----------------------------------------------------------------------
        # Webhook do Stripe (Streaming sem Buffering e sem Rate-Limit)
        # ----------------------------------------------------------------------
        location /api/billing/webhook {
            proxy_pass http://backend_cluster;
            proxy_buffering off;
            proxy_set_header Connection "";
            client_max_body_size 10M;
        }

        # ----------------------------------------------------------------------
        # Rotas Globais da API
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general_limit burst=20 nodelay;
            proxy_pass http://backend_cluster;
            proxy_set_header Connection "";
        }

        # ----------------------------------------------------------------------
        # Static Assets do Frontend (Edge Cache Acelerado)
        # ----------------------------------------------------------------------
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_cluster;
            proxy_cache static_cache;
            proxy_cache_valid 200 302 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            add_header X-Asset-Cache $upstream_cache_status always;
        }

        # ----------------------------------------------------------------------
        # Frontend Single Page Application (SPA Fallback)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_cluster;
        }
    }
}
