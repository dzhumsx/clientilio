worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream Cluster: Load Balancer across API backend instances
    upstream backend_cluster {
        # Balança conexões ativas de forma equilibrada entre nós disponíveis
        least_conn;
        server server:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream Frontend
    upstream frontend_cluster {
        server client:80 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        # Limite de upload para anexos e entregáveis
        client_max_body_size 25M;

        # Configuração de Headers Globais para Proxies
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Suporte a WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Timeouts de Proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Failover automático entre réplicas no cluster
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

        # Endpoint de Healthcheck do Load Balancer
        location /lb-health {
            access_log off;
            return 200 '{"status":"healthy","load_balancer":"nginx"}\n';
            add_header Content-Type application/json;
        }

        # Healthcheck da API
        location = /health {
            proxy_pass http://backend_cluster/health;
        }

        # Rotas da API
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Connection "";
        }

        # Rota de Webhooks do Stripe (precisa preservar payloads sem buffering agressivo)
        location /api/billing/webhook {
            proxy_pass http://backend_cluster;
            proxy_buffering off;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend_cluster;
        }
    }
}
